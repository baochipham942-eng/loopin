edition: 3.0.0
name: loopin-api-app

vars:
  region: "ap-southeast-1"

resources:
  api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: "loopin-api"
      description: "Loopin Fastify API - FC custom runtime"
      runtime: custom.debian10
      cpu: 1
      memorySize: 1024
      diskSize: 512
      timeout: 180
      instanceConcurrency: 10
      code: ./.fc/api
      customRuntimeConfig:
        command:
          - /var/fc/lang/nodejs20/bin/node
          - dist/server.js
        port: 8787
      triggers:
        - triggerName: http-trigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
        - triggerName: sweep-expired-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "@every 10m"
            enable: true
            payload: '{"task":"sweepExpired"}'
        - triggerName: event-reminder-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "@every 15m"
            enable: true
            payload: '{"task":"sendEventReminders"}'
        - triggerName: topic-signal-sync-timer
          triggerType: timer
          triggerConfig:
            cronExpression: "@every 6h"
            enable: true
            payload: '{"task":"syncTopicSignals"}'
      environmentVariables:
        PORT: "8787"
        NODE_ENV: "production"
        PUBLIC_BASE_URL: "https://loopin.llmxy.xyz"
        BACKOFFICE_ADMIN_TOKEN: ${env(BACKOFFICE_ADMIN_TOKEN)}
        DATABASE_URL: ${env(FC_DATABASE_URL)}
        WX_APPID: "wxfb83ad53ee194fe3"
        WX_APPSECRET: ${env(WX_APPSECRET)}
        WX_SUBSCRIBE_EVENT_TEMPLATE_ID: ${env(WX_SUBSCRIBE_EVENT_TEMPLATE_ID)}
        WX_EVENT_REMINDER_LEAD_MINUTES: ${env(WX_EVENT_REMINDER_LEAD_MINUTES)}
        WX_SUBSCRIBE_MINIPROGRAM_STATE: ${env(WX_SUBSCRIBE_MINIPROGRAM_STATE)}
        TOPIC_SIGNAL_FEED_URLS: ${env(TOPIC_SIGNAL_FEED_URLS)}
        LLM_BASE_URL: ${env(LLM_BASE_URL)}
        LLM_API_KEY: ${env(LLM_API_KEY)}
        LLM_MODEL: ${env(LLM_MODEL)}
        LLM_PROXY: ""
      customDomain:
        domainName: loopin.llmxy.xyz
        protocol: HTTP,HTTPS
        route:
          path: /*
          qualifier: LATEST
        certConfig:
          certId: ${env(ALIYUN_FC_CERT_ID)}
